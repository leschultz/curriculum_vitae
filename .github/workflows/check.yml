name: Build and check CV

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra biber poppler-utils
      - name: Check build failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Build CV
        run: bash build.sh
      - name: Check bibliography and PDF
        run: python3 scripts/check.py
      - name: Render page previews
        run: pdftoppm -scale-to 1400 -png cv_full_leschultz.pdf .build/preview
      - name: Upload PDF and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-vitae
          include-hidden-files: true
          path: |
            cv_full_leschultz.pdf
            .build/
